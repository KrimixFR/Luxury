<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Los Santos Chronicle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay" class="hidden">
        <div id="newspaper">

            <!-- EN-TÊTE -->
            <div id="paper-header">
                <div id="paper-motto">« La vérité, rien que la vérité — depuis 1952 »</div>
                <div id="paper-title">LOS SANTOS CHRONICLE</div>
                <div id="paper-meta">
                    <span id="paper-edition">N° 1</span>
                    <span id="paper-city">LOS SANTOS, CALIFORNIE</span>
                    <span id="paper-date">01/01/1987</span>
                </div>
                <div id="paper-price">PRIX : 5¢</div>
            </div>

            <hr class="rule-thick">

            <!-- ARTICLES -->
            <div id="articles-container"></div>

            <hr class="rule-thin">

            <!-- PIED DE PAGE -->
            <div id="paper-footer">
                <span id="footer-text">© 1987 Los Santos Chronicle — Tous droits réservés</span>
                <button id="btn-close">[ FERMER ]</button>
            </div>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
