# ================================================================
#  LOS SANTOS 1987 — Serveur FiveM Roleplay
#  Lore : Los Angeles, années 80 — Gangs, Vice Squad, Crack Cocaine
#  Framework : QBCore
# ================================================================

# --- Identité du serveur ---
sv_hostname "^1[RP] ^7Los Santos ^81987 ^7| ^3Gangs · Drogues · Vice Squad"
sets sv_projectName "Los Santos 1987"
sets sv_projectDesc "Plongez dans le Los Angeles des années 80 : guerres de gangs, cocaïne, Vice Squad et low-riders."
sets tags "roleplay, 80s, gangs, drugs, serious-rp, french, qbcore, los-angeles"
sets locale "fr-FR"
sets sv_enforceGameBuild "2699"

# --- Licence (à remplacer sur keymaster.fivem.net) ---
sv_licenseKey "changeme"

# --- Limites serveur ---
sv_maxclients 64
sv_scriptHookAllowed 0

# --- OneSync (requis pour >32 joueurs) ---
set onesync on

# ================================================================
#  ACE PERMISSIONS
# ================================================================
add_ace group.admin command allow
add_ace group.admin command.add_principal allow
add_ace group.mod command.kick allow
add_ace group.mod command.ban allow
add_ace group.mod command.setgroup allow

# Remplacer par votre identifiant Steam hex (sans le 0x)
add_principal identifier.steam:110000000000000 group.admin

# ================================================================
#  RESSOURCES PAR DÉFAUT FIVEM
# ================================================================
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure rconlog
ensure yarn
ensure webpack

# ================================================================
#  BASE DE DONNÉES — oxmysql
# ================================================================
ensure oxmysql
set mysql_connection_string "mysql://root:password@localhost/ls1987?charset=utf8mb4"
set mysql_slow_query_warning 200
set mysql_debug false

# ================================================================
#  LIBRAIRIES / UTILITAIRES
# ================================================================
ensure ox_lib

# ================================================================
#  FRAMEWORK — QBCore
# ================================================================
ensure qb-core

# Multicharacter (création de personnage avec lore 80s)
ensure qb-multicharacter

# Interface & inventaire
ensure qb-inventory
ensure qb-menu
ensure qb-input
ensure qb-target
ensure qb-notify
ensure qb-progressbar

# Apparence (vêtements 80s)
ensure qb-clothing

# Véhicules
ensure qb-vehiclekeys
ensure qb-vehicleshop
ensure qb-garages

# Économie (cash uniquement, style 80s)
ensure qb-banking
ensure qb-atm

# Spawn & météo
ensure qb-spawn
ensure qb-weathersync

# Emplois QBCore de base
ensure qb-ambulancejob
ensure qb-mechanicjob

# Police (étendue par eightys_police)
ensure qb-policejob

# ================================================================
#  SCRIPTS PERSONNALISÉS — LOS SANTOS 1987
# ================================================================

# Configuration globale & lore 80s
ensure eightys_core

# HUD rétro néon années 80
ensure eightys_hud

# Système de drogues complet (crack, coke, weed, PCP)
ensure eightys_drugs

# Gangs et territoires (Los Rojos, Los Azules, Los Surenos, La Cosa Nostra)
ensure eightys_gangs

# Police LAPD & Vice Squad
ensure eightys_police

# Pager & cabines téléphoniques (pas de smartphones)
ensure eightys_pager

# Véhicules 80s uniquement (low-riders, muscle cars)
ensure eightys_vehicles

# Jobs civils (taxi, mécano, camionneur, pêcheur)
ensure eightys_jobs

# ================================================================
#  MAPS PERSONNALISÉES
# ================================================================
ensure AutoLuxe

# ================================================================
#  PARAMÈTRES MÉTÉO & HEURE
# ================================================================
# Los Angeles = toujours ensoleillé
setr sv_weather "EXTRASUNNY"
setr sv_clouds "Clear"
setr sv_blackout false

# Heure réelle synchronisée (mode 80s : décalage fixe)
setr sv_time_hour 14
setr sv_time_minute 0
setr sv_timescale 1.0

# ================================================================
#  VOICE CHAT
# ================================================================
setr voice_defaultCycle "RADIO"
setr voice_defaultVolume 0.3
setr voice_enableProximityCycling false
set voice_useSendingRangeOnly true

# ================================================================
#  SÉCURITÉ
# ================================================================
sv_filterRequestControl 1
sv_authMaxVariance 1
sv_authMinTrust 5
